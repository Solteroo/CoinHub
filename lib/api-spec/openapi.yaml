openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CoinHub API - virtual coin economy platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: user
    description: Current user operations
  - name: games
    description: Casino-style game endpoints
  - name: leaderboard
    description: Leaderboard
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Täze ulanyjy döretmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
                password:
                  type: string
                  minLength: 4
                  maxLength: 64
              required: [username, password]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Ulanyjy girmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Çykmak
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /me:
    get:
      operationId: getMe
      tags: [user]
      summary: Häzirki ulanyjy maglumaty
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /me/transactions:
    get:
      operationId: getMyTransactions
      tags: [user]
      summary: Meniň amallarym taryhy
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /me/stats:
    get:
      operationId: getMyStats
      tags: [user]
      summary: Meniň statistikalarym
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /games/config:
    get:
      operationId: getGamesConfig
      tags: [games]
      summary: Oýun parametrleri (min/max bet, segmentler)
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesConfig"

  /games/slot:
    post:
      operationId: playSlot
      tags: [games]
      summary: Slot maşyn (3 reel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
              required: [bet]
      responses:
        "200":
          description: Slot result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotResult"

  /games/spin:
    post:
      operationId: playSpin
      tags: [games]
      summary: Bagt çarhy (multiplier)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
              required: [bet]
      responses:
        "200":
          description: Spin result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpinResult"

  /games/luckybox:
    post:
      operationId: playLuckyBox
      tags: [games]
      summary: Bagt gutusy (9 sandyk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                pickIndex:
                  type: integer
                  minimum: 0
                  maximum: 8
              required: [bet, pickIndex]
      responses:
        "200":
          description: Lucky box result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LuckyBoxResult"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Lider tagtasy
      responses:
        "200":
          description: Top users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin girmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        "200":
          description: Admin logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin çykmak
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Admin sessiýa barlamak
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Ähli ulanyjylar
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Ulanyjyny görmek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"

  /admin/users/{userId}/coins:
    post:
      operationId: adminAdjustCoins
      tags: [admin]
      summary: Ulanyja teňňe goşmak / aýyrmak
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
              required: [amount, reason]
      responses:
        "200":
          description: Adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"

  /admin/transactions:
    get:
      operationId: adminListTransactions
      tags: [admin]
      summary: Ähli amallar taryhy
      parameters:
        - in: query
          name: userId
          schema:
            type: string
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /admin/stats:
    get:
      operationId: adminStats
      tags: [admin]
      summary: Admin paneliň umumy statistikasy
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    User:
      type: object
      properties:
        id:
          type: string
        publicId:
          type: string
        username:
          type: string
        coins:
          type: integer
        createdAt:
          type: string
        isAdmin:
          type: boolean
      required: [id, publicId, username, coins, createdAt, isAdmin]

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: integer
        reason:
          type: string
        source:
          type: string
        createdAt:
          type: string
      required: [id, userId, amount, reason, source, createdAt]

    UserStats:
      type: object
      properties:
        totalEarned:
          type: integer
        totalSpent:
          type: integer
        gamesPlayed:
          type: integer
        rank:
          type: integer
          nullable: true
      required: [totalEarned, totalSpent, gamesPlayed]

    GamesConfig:
      type: object
      properties:
        minBet:
          type: integer
        maxBet:
          type: integer
        wheelSegments:
          type: array
          items:
            $ref: "#/components/schemas/WheelSegment"
        slotSymbols:
          type: array
          items:
            type: string
      required: [minBet, maxBet, wheelSegments, slotSymbols]

    WheelSegment:
      type: object
      properties:
        multiplier:
          type: number
        label:
          type: string
        color:
          type: string
        rarity:
          type: string
      required: [multiplier, label, color, rarity]

    SlotResult:
      type: object
      properties:
        bet:
          type: integer
        symbols:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
        multiplier:
          type: number
        won:
          type: integer
        netChange:
          type: integer
        newBalance:
          type: integer
        label:
          type: string
        rarity:
          type: string
        outcome:
          type: string
      required: [bet, symbols, multiplier, won, netChange, newBalance, label, rarity, outcome]

    SpinResult:
      type: object
      properties:
        bet:
          type: integer
        segmentIndex:
          type: integer
        multiplier:
          type: number
        won:
          type: integer
        netChange:
          type: integer
        newBalance:
          type: integer
        label:
          type: string
        rarity:
          type: string
      required: [bet, segmentIndex, multiplier, won, netChange, newBalance, label, rarity]

    LuckyBoxResult:
      type: object
      properties:
        bet:
          type: integer
        pickIndex:
          type: integer
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/LuckyBoxReveal"
          minItems: 9
          maxItems: 9
        multiplier:
          type: number
        won:
          type: integer
        netChange:
          type: integer
        newBalance:
          type: integer
        label:
          type: string
        rarity:
          type: string
      required: [bet, pickIndex, boxes, multiplier, won, netChange, newBalance, label, rarity]

    LuckyBoxReveal:
      type: object
      properties:
        multiplier:
          type: number
        rarity:
          type: string
      required: [multiplier, rarity]

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        publicId:
          type: string
        username:
          type: string
        coins:
          type: integer
      required: [rank, publicId, username, coins]

    AdminStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
      required: [isAdmin]

    AdminUser:
      type: object
      properties:
        id:
          type: string
        publicId:
          type: string
        username:
          type: string
        coins:
          type: integer
        createdAt:
          type: string
      required: [id, publicId, username, coins, createdAt]

    AdminUserDetail:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
      required: [user, transactions]

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalCoinsInCirculation:
          type: integer
        totalTransactions:
          type: integer
        coinsAddedToday:
          type: integer
      required: [totalUsers, totalCoinsInCirculation, totalTransactions, coinsAddedToday]
