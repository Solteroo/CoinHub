openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CoinHub API - virtual coin economy platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: user
    description: Current user operations
  - name: games
    description: Casino-style game endpoints
  - name: leaderboard
    description: Leaderboard
  - name: chat
    description: Global chat
  - name: social
    description: Friends, DMs, public profiles
  - name: news
    description: News and announcements
  - name: notifications
    description: User notifications
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Täze ulanyjy döretmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 4
                  maxLength: 64
              required: [email, password]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Ulanyjy girmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Çykmak
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /me:
    get:
      operationId: getMe
      tags: [user]
      summary: Häzirki ulanyjy maglumaty
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /me/transactions:
    get:
      operationId: getMyTransactions
      tags: [user]
      summary: Meniň amallarym taryhy
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /me/stats:
    get:
      operationId: getMyStats
      tags: [user]
      summary: Meniň statistikalarym
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [user]
      summary: Profil maglumatlary täzelemek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
                bio:
                  type: string
                  maxLength: 200
                avatarColor:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /me/transfer:
    post:
      operationId: transferCoins
      tags: [user]
      summary: Başga ulanyja TMT geçirmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientPublicId:
                  type: string
                amount:
                  type: integer
                  minimum: 1
                note:
                  type: string
                  maxLength: 100
              required: [recipientPublicId, amount]
      responses:
        "200":
          description: Transfer success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"

  /me/claim-bonus:
    post:
      operationId: claimBonus
      tags: [user]
      summary: 3 günlük bonusy almak
      responses:
        "200":
          description: Bonus result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusResult"

  /me/notifications:
    get:
      operationId: getMyNotifications
      tags: [notifications]
      summary: Meniň bildirişlerim
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /me/notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Bildirişleri okaldy diýip belgilemek
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /users/search:
    get:
      operationId: searchUsers
      tags: [social]
      summary: ID/at boýunça ulanyjy tapmak
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicUser"

  /users/{publicId}:
    get:
      operationId: getPublicProfile
      tags: [social]
      summary: Açyk profil
      parameters:
        - in: path
          name: publicId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"

  /friends:
    get:
      operationId: getFriends
      tags: [social]
      summary: Dostlarym (we sargyt edenler)
      responses:
        "200":
          description: Friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendList"

  /friends/request:
    post:
      operationId: sendFriendRequest
      tags: [social]
      summary: Dostluk sorag ibermek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicId:
                  type: string
              required: [publicId]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /friends/{userId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [social]
      summary: Sorag kabul etmek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      tags: [social]
      summary: Dosty pozmak / sorag ret etmek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /dm/threads:
    get:
      operationId: getDmThreads
      tags: [social]
      summary: Şahsy ýazyşmalar
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmThread"

  /dm/{userId}/messages:
    get:
      operationId: getDmMessages
      tags: [social]
      summary: Bir adam bilen ýazyşma
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmMessage"
    post:
      operationId: sendDmMessage
      tags: [social]
      summary: Şahsy habar ibermek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 500
              required: [message]
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmMessage"

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Tazelikler
      responses:
        "200":
          description: News
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsPost"

  /admin/news:
    post:
      operationId: adminCreateNews
      tags: [admin]
      summary: Tazelik döretmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required: [title, body]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"

  /admin/news/{newsId}:
    delete:
      operationId: adminDeleteNews
      tags: [admin]
      summary: Tazelik öçürmek
      parameters:
        - in: path
          name: newsId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/users/{userId}/set-admin:
    post:
      operationId: adminSetAdmin
      tags: [admin]
      summary: Ulanyjyny admin owner edip belgilemek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAdmin:
                  type: boolean
              required: [isAdmin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/users/{userId}/ban-chat:
    post:
      operationId: adminBanChat
      tags: [admin]
      summary: Ulanyjyny çatda gadagan etmek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:
                  type: integer
                  minimum: 0
              required: [minutes]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/owner:
    get:
      operationId: getAdminOwner
      tags: [admin]
      summary: Admin owner ulanyjynyň açyk maglumatlary
      responses:
        "200":
          description: Owner public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"

  /games/config:
    get:
      operationId: getGamesConfig
      tags: [games]
      summary: Oýun parametrleri (min/max bet, segmentler)
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesConfig"

  /games/slot:
    post:
      operationId: playSlot
      tags: [games]
      summary: Slot maşyn (3 reel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
              required: [bet]
      responses:
        "200":
          description: Slot result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotResult"

  /games/spin:
    post:
      operationId: playSpin
      tags: [games]
      summary: Bagt çarhy (multiplier)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
              required: [bet]
      responses:
        "200":
          description: Spin result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpinResult"

  /games/luckybox:
    post:
      operationId: playLuckyBox
      tags: [games]
      summary: Bagt gutusy (9 sandyk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                pickIndex:
                  type: integer
                  minimum: 0
                  maximum: 8
              required: [bet, pickIndex]
      responses:
        "200":
          description: Lucky box result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LuckyBoxResult"

  /games/crash:
    post:
      operationId: playCrash
      tags: [games]
      summary: Bagt uçuşy (rocket multiplier with auto-cashout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                autoCashout:
                  type: number
                  minimum: 1.01
                  maximum: 50
              required: [bet, autoCashout]
      responses:
        "200":
          description: Crash result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrashResult"

  /games/dice:
    post:
      operationId: playDice
      tags: [games]
      summary: Zar oýny (high/low)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                choice:
                  type: string
                  enum: [high, low]
              required: [bet, choice]
      responses:
        "200":
          description: Dice result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiceResult"

  /games/mines:
    post:
      operationId: playMines
      tags: [games]
      summary: Minalar oýny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                picks:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 24
                  minItems: 1
                  maxItems: 8
              required: [bet, picks]
      responses:
        "200":
          description: Mines result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinesResult"

  /games/roulette:
    post:
      operationId: playRoulette
      tags: [games]
      summary: Ruletka
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                betType:
                  type: string
                  enum: [red, black, zero]
              required: [bet, betType]
      responses:
        "200":
          description: Roulette result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouletteResult"

  /games/plinko:
    post:
      operationId: playPlinko
      tags: [games]
      summary: Plinko
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                risk:
                  type: string
                  enum: [low, medium, high]
              required: [bet, risk]
      responses:
        "200":
          description: Plinko result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlinkoResult"

  /games/hilo:
    post:
      operationId: playHiLo
      tags: [games]
      summary: Hi-Lo kart oýny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bet:
                  type: integer
                  minimum: 1
                choice:
                  type: string
                  enum: [high, low]
              required: [bet, choice]
      responses:
        "200":
          description: HiLo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiLoResult"

  /chat/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Soňky çat habarlary
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: postChatMessage
      tags: [chat]
      summary: Habar ibermek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 200
              required: [message]
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /admin/chat/messages/{messageId}:
    delete:
      operationId: adminDeleteChatMessage
      tags: [admin]
      summary: Çat habary öçürmek
      parameters:
        - in: path
          name: messageId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Lider tagtasy
      responses:
        "200":
          description: Top users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin girmek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        "200":
          description: Admin logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin çykmak
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Admin sessiýa barlamak
      responses:
        "200":
          description: Admin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Ähli ulanyjylar
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Ulanyjyny görmek
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"

  /admin/users/{userId}/coins:
    post:
      operationId: adminAdjustCoins
      tags: [admin]
      summary: Ulanyja teňňe goşmak / aýyrmak
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                coinType:
                  type: string
                  description: "real | bonus (default: bonus)"
              required: [amount, reason]
      responses:
        "200":
          description: Adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"

  /admin/transactions:
    get:
      operationId: adminListTransactions
      tags: [admin]
      summary: Ähli amallar taryhy
      parameters:
        - in: query
          name: userId
          schema:
            type: string
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /admin/stats:
    get:
      operationId: adminStats
      tags: [admin]
      summary: Admin paneliň umumy statistikasy
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    User:
      type: object
      properties:
        id:
          type: string
        publicId:
          type: string
        username:
          type: string
        coins:
          type: integer
          description: Total balance (bonusCoins + realCoins)
        bonusCoins:
          type: integer
          description: Demo/bonus coins from 3-day claim or owner gift
        realCoins:
          type: integer
          description: Real coins given only by owner
        createdAt:
          type: string
        isAdmin:
          type: boolean
        email:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarColor:
          type: string
        avatarEmoji:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        bonusReady:
          type: boolean
        unreadNotifications:
          type: integer
        unreadDms:
          type: integer
      required: [id, publicId, username, coins, bonusCoins, realCoins, createdAt, isAdmin, avatarColor, bonusReady, unreadNotifications, unreadDms]

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: integer
        reason:
          type: string
        source:
          type: string
        createdAt:
          type: string
      required: [id, userId, amount, reason, source, createdAt]

    UserStats:
      type: object
      properties:
        totalEarned:
          type: integer
        totalSpent:
          type: integer
        gamesPlayed:
          type: integer
        rank:
          type: integer
          nullable: true
      required: [totalEarned, totalSpent, gamesPlayed]

    GamesConfig:
      type: object
      properties:
        minBet:
          type: integer
        maxBet:
          type: integer
        wheelSegments:
          type: array
          items:
            $ref: "#/components/schemas/WheelSegment"
        slotSymbols:
          type: array
          items:
            type: string
      required: [minBet, maxBet, wheelSegments, slotSymbols]

    WheelSegment:
      type: object
