kind = "web"
previewPath = "/"
title = "CoinHub"
version = "1.0.0"
id = "artifacts/coinhub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18717

[services.development]
run = "pnpm --filter @workspace/coinhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coinhub", "run", "build" ]
publicDir = "artifacts/coinhub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18717"
BASE_PATH = "/"
